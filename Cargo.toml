[package]
name = "ali"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fidenit/ALI"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
wry = "0.57.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.15"
